<!doctype html>
<html lang="en" data-theme="soft">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zaan Workbench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=STIX+Two+Text:ital@0;1&display=swap" />
  <link rel="stylesheet" href="css/workbench.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="#system"><span class="mark">Z</span><span><b>Zaan</b> workbench</span></a>
    <nav class="pages" id="pages" aria-label="Pages"></nav>
    <div class="toggles">
      <button class="tog" id="togTop" title="Show or hide the summary bar">summary</button>
      <button class="tog" id="togSide" title="Show or hide the side panel">side panel</button>
      <button class="tog on" id="togUnit" title="Show noise and charge as charge in fC, or as the voltage it means at the input">show in fC</button>
      <button class="tog" id="togTheme" title="Soft, dark or light">theme</button>
    </div>
  </header>
  <div class="summary" id="summary"></div>
  <div class="body" id="body">
    <aside class="side" id="side"></aside>
    <main class="main" id="main"></main>
  </div>
  <script type="module" src="src/workbench/app.js"></script>
</body>
</html>
